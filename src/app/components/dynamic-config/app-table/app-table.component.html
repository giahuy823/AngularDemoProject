<nz-card nzTitle="Danh sách sinh viên">

  <nz-table #data [nzData]="studentList" [nzBordered]="true" [nzPageSize]="3">

    <thead>
      <tr>
        <th>Name</th>
        <th>Gender</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Birthday</th>
        <th>Action</th>

      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let s of data.data"
        (click)="onRowClick(s)"
        class="table-row"
        [class.selected-row]="isSelected(s)"
      >
        <td>{{ s.name }}</td>
        <td>{{ s.gender }}</td>
        <td>{{ s.email }}</td>
        <td>0{{ s.phoneNumber }}</td>
        <td>{{ s.birthday | date: "dd/MM/yyyy" }}</td>
        <td (click)="$event.stopPropagation()">
          <button nz-button nzType="link" (click)="onRowClick(s)">Edit</button>
          
        </td>

      </tr>
    </tbody>

  </nz-table>

      Submit
    </button>
  </div> -->

</nz-card>
