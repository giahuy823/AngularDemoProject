<nz-card nzTitle="Danh sách sinh viên">

  <nz-table [nzData]="studentList" [nzBordered]="true">

    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Gender</th>
        <th>Email</th>
        <th>Action</th>

      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let s of studentList"
        (click)="onRowClick(s)"
        style="cursor: pointer;"
      >
        <td>{{ s.name }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.gender }}</td>
        <td>{{ s.email }}</td>

        <td (click)="$event.stopPropagation()">
          <button nz-button nzType="link">Edit</button>
          <button nz-button nzType="link" nzDanger (click)="onDelete(s)">
            Delete
          </button>
        </td>

      </tr>
    </tbody>

  </nz-table>

</nz-card>
